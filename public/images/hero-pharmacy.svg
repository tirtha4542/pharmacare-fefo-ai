<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="200" r="160" fill="url(#bgGlow)"/>

  <!-- Medicine Bottle -->
  <g filter="url(#softShadow)">
    <!-- Bottle Cap -->
    <rect x="180" y="80" width="80" height="26" rx="6" fill="#334155"/>
    <rect x="190" y="106" width="60" height="14" fill="#64748b"/>
    <!-- Bottle Body -->
    <rect x="160" y="120" width="120" height="190" rx="20" fill="url(#bottleGrad)"/>
    <!-- Label -->
    <rect x="160" y="155" width="120" height="115" fill="#f8fafc"/>
    <rect x="175" y="170" width="90" height="12" rx="4" fill="url(#tealGrad)"/>
    <rect x="175" y="192" width="70" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="175" y="204" width="80" height="6" rx="3" fill="#cbd5e1"/>
    <!-- Cross on Bottle -->
    <circle cx="220" cy="235" r="16" fill="#ecfdf5"/>
    <path d="M220 225 V245 M210 235 H230" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating Large Capsule -->
  <g filter="url(#softShadow)" transform="rotate(-25 320 220)">
    <rect x="300" y="140" width="48" height="130" rx="24" fill="url(#blueGrad)"/>
    <path d="M300 205 H348 V246 A24 24 0 0 1 300 246 Z" fill="url(#tealGrad)"/>
    <!-- Reflection Line -->
    <path d="M308 155 V195" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Prescription Card floating left -->
  <g filter="url(#cardGlow)">
    <rect x="60" y="170" width="120" height="150" rx="14" fill="#ffffff"/>
    <rect x="75" y="185" width="45" height="10" rx="3" fill="#0f766e"/>
    <line x1="75" y1="210" x2="160" y2="210" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="75" y1="225" x2="145" y2="225" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="75" y1="240" x2="155" y2="240" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    <!-- Stamp -->
    <circle cx="140" cy="280" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M134 280 L138 284 L146 274" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Floating Mini Pills -->
  <circle cx="360" cy="110" r="18" fill="url(#amberGrad)" filter="url(#softShadow)"/>
  <circle cx="130" cy="120" r="14" fill="#38bdf8" filter="url(#softShadow)"/>
  <ellipse cx="290" cy="330" rx="16" ry="10" fill="#a7f3d0" transform="rotate(30 290 330)"/>
</svg>

