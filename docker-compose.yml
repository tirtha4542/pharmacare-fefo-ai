version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pharmacare-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword@2026
      MYSQL_DATABASE: pharmacy_db
      MYSQL_USER: pharma_user
      MYSQL_PASSWORD: PharmaUser@2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pharma_user", "-pPharmaUser@2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmacare-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: pharma_user
      DB_PASSWORD: PharmaUser@2026
      DB_NAME: pharmacy_db
      JWT_SECRET: super_production_secret_pharmacy_jwt_key_2026_pro
      JWT_EXPIRES_IN: 1d
      RATE_LIMIT_GLOBAL: 300
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:

